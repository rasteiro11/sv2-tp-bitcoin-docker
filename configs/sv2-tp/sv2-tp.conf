chain=testnet4

# RPC connection to Bitcoin Core (default; switch to IPC only if using IPC-enabled Bitcoin build)
rpcconnect=127.0.0.1
rpcuser=username
rpcpassword=password
# Default RPC port for testnet (Bitcoin Core v30 testnet4): 18332
rpcport=18332

# Template generation interval (in seconds)
sv2interval=30

# Delta fees to reach before sending new templates (in satoshis)
sv2feedelta=1000

debug=sv2
loglevel=sv2:trace