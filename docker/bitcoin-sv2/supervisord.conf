[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
user=root

[program:bitcoind]
command=bitcoind -datadir=/root/.bitcoin -printtoconsole
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1

[program:sv2-tp]
command=/usr/local/bin/sv2-tp -conf=/root/sv2-tp.conf -datadir=/root/.bitcoin -debug=sv2 -loglevel=sv2:trace
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2
# Wait for bitcoind to start
startsecs=10
