[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
user=root

[program:bitcoind]
command=/bin/sh -lc "/opt/bitcoin-30.0/bin/bitcoin -m node -testnet4 -ipcbind=unix -datadir=/root/.bitcoin"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1

[program:sv2-tp]
command=/bin/sh -lc "sleep 30; exec /opt/sv2-tp-1.0.3/bin/sv2-tp -conf=/root/sv2-tp.conf -datadir=/root/.bitcoin $SV2TP_ARGS"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2
startsecs=10